<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>LifeOS 语音 · Whisper 1.2</title>
<style>
  :root{
    --teal:#5fe6d4; --primary-deep:#1f9e90; --primary-soft:#0f3b37;
    --bg:#070d12; --bg2:#0c161d;
    --surface:rgba(22,34,42,.62); --glass:rgba(28,42,52,.55);
    --glass-2:rgba(255,255,255,.08); --border:rgba(255,255,255,.14);
    --text:#eaf6f4; --sub:#8fb0ad; --line:rgba(255,255,255,.10);
    --gloss:rgba(255,255,255,.5); --danger:#ff7a7a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--text); background:
      radial-gradient(1200px 800px at 70% -10%, rgba(95,230,212,.10), transparent 60%),
      radial-gradient(900px 700px at -10% 110%, rgba(31,158,144,.12), transparent 55%),
      linear-gradient(180deg,var(--bg),var(--bg2));
    min-height:100%; display:flex; flex-direction:column; align-items:center;
    padding:max(18px,env(safe-area-inset-top)) 16px 24px; gap:18px;
  }
  .head{text-align:center;margin-top:6px}
  .head h1{font-size:20px;margin:0;letter-spacing:.5px}
  .head p{margin:4px 0 0;color:var(--sub);font-size:12.5px}
  .card{
    width:100%;max-width:480px;background:var(--surface);
    border:1px solid var(--border);border-radius:26px;padding:22px 20px 20px;
    backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);
    box-shadow:0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 var(--gloss);
  }
  .mic-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;margin:6px 0 4px}
  .mic{
    width:128px;height:128px;border-radius:50%;border:none;cursor:pointer;position:relative;
    background:linear-gradient(180deg,var(--teal),var(--primary-deep));
    color:#04201d;font-size:46px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 16px 40px #1f9e90aa, inset 0 1px 0 var(--gloss);
    transition:transform .2s cubic-bezier(.2,.9,.3,1), box-shadow .2s;
    user-select:none; touch-action:none;
  }
  .mic:active{transform:scale(.96)}
  .mic.rec{animation:pulse 1.4s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(95,230,212,.55)}70%{box-shadow:0 0 0 26px rgba(95,230,212,0)}100%{box-shadow:0 0 0 0 rgba(95,230,212,0)}}
  .timer{font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;letter-spacing:1px}
  .status{color:var(--sub);font-size:13.5px;min-height:18px;text-align:center}
  .status.err{color:var(--danger)}
  .progress{height:6px;border-radius:6px;background:var(--glass-2);overflow:hidden;margin:10px 0 2px;display:none}
  .progress.show{display:block}
  .progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--primary-deep));transition:width .2s}
  .out{
    width:100%;min-height:120px;max-height:38vh;overflow:auto;margin-top:14px;resize:none;
    background:var(--glass);border:1px solid var(--line);border-radius:16px;color:var(--text);
    padding:14px;font-size:15px;line-height:1.6;
  }
  .out:empty:before{content:"识别结果会显示在这里…";color:var(--sub)}
  .actions{display:flex;gap:10px;margin-top:12px}
  .btn{flex:1;padding:12px;border-radius:14px;border:1px solid var(--border);
    background:var(--glass-2);color:var(--text);font-size:14px;cursor:pointer}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:linear-gradient(180deg,var(--teal),var(--primary-deep));color:#04201d;border:none;font-weight:600}
  .hint{color:var(--sub);font-size:11.5px;text-align:center;margin-top:8px;line-height:1.5}
  .debug{width:100%;max-width:480px;font-size:11px;color:var(--sub);white-space:pre-wrap;
    background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:10px;max-height:120px;overflow:auto;display:none}
  .debug.show{display:block}
</style>
</head>
<body>
  <div class="head">
    <h1>LifeOS 语音 · Whisper</h1>
    <p>端侧识别 · 中英混说 · 最长 5 分钟</p>
  </div>

  <div class="card">
    <div class="mic-wrap">
      <button class="mic" id="mic" aria-label="开始/停止录音">🎙️</button>
      <div class="timer" id="timer">00:00</div>
    </div>
    <div class="status" id="status">点按麦克风开始说话</div>
    <div class="progress" id="prog"><i id="progBar"></i></div>
    <textarea class="out" id="out" readonly></textarea>
    <div class="actions">
      <button class="btn primary" id="copy">复制结果</button>
      <button class="btn" id="clear">清空</button>
      <button class="btn" id="toggleDebug">调试</button>
    </div>
    <div class="hint">首次使用会从 CDN 下载约 75MB 的 Whisper 模型（需联网一次，之后离线可用）。录音不受模型下载影响，停止后自动转写。</div>
  </div>

  <div class="debug" id="debug"></div>

<script>
/* ============ Whisper 端侧转写（transformers.js WASM） ============ */
const WHISPER_MODEL = 'Xenova/whisper-tiny'; // 多语言 tiny，支持中英混说
let whisperPipe = null, whisperLoading = false;

function dlog(m){ const el=document.getElementById('debug'); if(el){ el.textContent += m + "\n"; el.scrollTop = el.scrollHeight; } console.log('[rec] ' + m); }

function whisperProgress(p){
  const prog=document.getElementById('prog'), bar=document.getElementById('progBar');
  if(p && p.status==='progress' && typeof p.progress==='number'){
    prog.classList.add('show'); bar.style.width = Math.round(p.progress*100) + '%';
  } else if(p && (p.status==='ready'||p.status==='done')){
    prog.classList.remove('show');
  }
}
async function loadWhisper(){
  if(whisperPipe) return whisperPipe;
  if(whisperLoading) return null;
  whisperLoading = true;
  try{
    dlog('loading transformers.js from CDN…');
    const mod = await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@3');
    const { pipeline } = mod;
    dlog('loading model ' + WHISPER_MODEL + ' …');
    whisperPipe = await pipeline('automatic-speech-recognition', WHISPER_MODEL, {
      device:'wasm', dtype:'q8', chunk_length_s:30, stride_length_s:5, progress_callback:whisperProgress
    });
    dlog('whisper model ready');
    return whisperPipe;
  }catch(e){ console.error('loadWhisper failed', e); whisperLoading=false; throw e; }
}
async function resampleTo16k(ab){
  const OC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  const off = new OC(1, Math.max(1, Math.ceil(ab.duration*16000)), 16000);
  const s = off.createBufferSource(); s.buffer = ab; s.connect(off.destination); s.start();
  const r = await off.startRendering(); return r.getChannelData(0);
}
async function transcribeViaWhisper(blob){
  const arr = await blob.arrayBuffer();
  const AC = window.AudioContext || window.webkitAudioContext;
  const ac = new AC();
  const buf = await ac.decodeAudioData(arr.slice(0));
  const f32 = await resampleTo16k(buf);
  if(ac.close) try{ ac.close(); }catch(_){}
  const pipe = await loadWhisper();
  // 不强制 language：让 Whisper 自动判定，保留中英混说能力
  const out = await pipe(f32, { sampling_rate:16000, task:'transcribe', return_timestamps:false });
  return (out && out.text) || '';
}

/* ============ 原生采集桥（window.AndroidVoice） ============ */
window.__voiceChunks = [];
window.__voiceChunk = p => { window.__voiceChunks.push(p); };
window.__voiceStopped = () => {
  const b64 = window.__voiceChunks.join(''); window.__voiceChunks = [];
  onWav(b64);
};
window.__voiceError = msg => { stopUI(); setStatus(msg, true); dlog('ERROR ' + msg); };

function b64ToBytes(b64){
  const bin = atob(b64); const len = bin.length;
  const bytes = new Uint8Array(len);
  for(let i=0;i<len;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
async function onWav(b64){
  try{
    const bytes = b64ToBytes(b64);
    dlog('wav bytes=' + bytes.length);
    if(bytes.length < 100){ setStatus('未录到有效音频', true); stopUI(); return; }
    const blob = new Blob([bytes], { type:'audio/wav' });
    setStatus('识别中…端侧 Whisper 转写（首次可能需下载模型）');
    const text = (await transcribeViaWhisper(blob)).trim();
    if(!text){ setStatus('未识别到内容，请再试一次'); }
    else {
      const out = document.getElementById('out');
      out.value = (out.value ? out.value + '\n' : '') + text;
      setStatus('识别完成');
      dlog('transcript: ' + text);
    }
  }catch(e){
    setStatus('识别失败：' + (e && e.message || e), true); dlog('transcribe error ' + e);
  }finally{ stopUI(); }
}

/* ============ UI / 录音控制 ============ */
const mic = document.getElementById('mic');
const timerEl = document.getElementById('timer');
const statusEl = document.getElementById('status');
let recording = false, timerId = null, recStart = 0;

function setStatus(t, err){ statusEl.textContent = t; statusEl.className = 'status' + (err ? ' err' : ''); }
function fmt(sec){ const m=Math.floor(sec/60), s=sec%60; return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
function startUI(){ recording = true; mic.classList.add('rec'); recStart = Date.now();
  timerEl.textContent='00:00';
  timerId = setInterval(()=>{ const s=Math.floor((Date.now()-recStart)/1000); timerEl.textContent=fmt(s);
    if(s>=300){ dlog('reached 5min cap, auto-stop'); stopRec(); } }, 250);
}
function stopUI(){ recording = false; mic.classList.remove('rec'); if(timerId){ clearInterval(timerId); timerId=null; } }

function startRec(){
  if(recording) return;
  if(typeof AndroidVoice === 'undefined'){ setStatus('原生采集桥未就绪（请确认已安装最新 APK）', true); return; }
  setStatus('录音中… 再次点按麦克风结束');
  startUI();
  try{ AndroidVoice.start(); }catch(e){ setStatus('启动录音失败：' + e.message, true); stopUI(); }
}
function stopRec(){
  if(!recording) return;
  stopUI();
  setStatus('处理中…');
  try{ AndroidVoice.stop(); }catch(e){ setStatus('停止录音失败：' + e.message, true); }
}
mic.addEventListener('click', ()=>{ recording ? stopRec() : startRec(); });

document.getElementById('copy').addEventListener('click', async ()=>{
  const t = document.getElementById('out').value;
  if(!t){ setStatus('没有可复制的内容'); return; }
  try{
    if(window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Clipboard){ await Capacitor.Plugins.Clipboard.write({string:t}); }
    else if(navigator.clipboard && navigator.clipboard.writeText){ await navigator.clipboard.writeText(t); }
    else { const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
    setStatus('已复制');
  }catch(e){ setStatus('复制失败：' + e.message, true); }
});
document.getElementById('clear').addEventListener('click', ()=>{ document.getElementById('out').value=''; setStatus('已清空'); });
document.getElementById('toggleDebug').addEventListener('click', ()=>{ document.getElementById('debug').classList.toggle('show'); });

/* 页面加载即预热模型（后台下载），不影响录音 */
loadWhisper().catch(e=> dlog('preload note: ' + e));
</script>
</body>
</html>
